; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:common_env_data]
; Use the community-maintained v3 platform
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
lib_ldf_mode = deep
board_build.partitions = no_ota.csv
monitor_speed = 115200
extra_scripts = replace_fs.py
board_build.filesystem = littlefs

lib_deps = 
  lvgl/lvgl @ ^9.2.0
  bodmer/TFT_eSPI @ ^2.5.43
  t-vk/ESP32 BLE Keyboard @ ^0.3.2
  h2zero/NimBLE-Arduino @ ^1.4.1
  bblanchon/ArduinoJson @ ^7.0.0

build_flags = 
  ${env.build_flags}
  -D USE_NIMBLE               ; Optimizes RAM for BLE
  -D LV_CONF_SKIP             ; Configure LVGL via build flags
  -D LV_COLOR_DEPTH=16
  -D LV_COLOR_16_SWAP=1
  -D LV_TICK_CUSTOM=1
  -D LV_USE_FS_ARDUINO_ESP_LITTLEFS=1
  -D LV_FS_ARDUINO_ESP_LITTLEFS_LETTER=\\\'A\\\'
  -D LV_FONT_MONTSERRAT_10=1
  -D LV_CACHE_DEF_SIZE=32768   ; Allocate 32KB for image caching
  -D LV_BIN_DECODER_RAM_LOAD=1 ; Load small binaries to RAM for speed
  -D LV_USE_BIN_DECODER=1
  -D USER_SETUP_LOADED=1
  -D TFT_ROTATION=1             ; Landscape orientation  
  -D LOAD_GLCD=1   
  -D LOAD_FONT2=1 
  -D LOAD_FONT4=1  
  -D LOAD_FONT6=1  
  -D LOAD_FONT7=1  
  -D LOAD_FONT8=1  
  -D LOAD_GFXFF=1  
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D DEBUG_LEVEL=4

  ; --- Environment for 4-inch Screen (ST7796 Driver) ---
[env:esp32-4inch]
extends = env:common_env_data
build_flags =
  ${env:common_env_data.build_flags}
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320   
  -D TFT_HEIGHT=480
; Logic (Landscape for UI)
  -D SCREEN_WIDTH=480
  -D SCREEN_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TOUCH_CS=33
  -D TOUCH_INTERRUPT_PIN=GPIO_NUM_36
  -D TFT_RGB_ORDER=TFT_BGR
  -D CONFIG_FILE=\"/config.4x5.json\"


; --- Environment for 2.8-inch Screen (Example: ILI9341 Driver) ---
[env:esp32-2-8inch]
extends = env:common_env_data
build_flags = 
  ${env:common_env_data.build_flags}
  -D ILI9341_2_DRIVER=1     ; Example: ILI9341 driver
  -D TFT_WIDTH=240        ; Set your 2.8" width
  -D TFT_HEIGHT=320       ; Set your 2.8" height
  -D SCREEN_WIDTH=320
  -D SCREEN_HEIGHT=240
  -D TFT_MISO=12          ; Example pin for 2.8"
  -D TFT_MOSI=13          ; Example pin for 2.8"
  -D TFT_SCLK=14          ; Example pin for 2.8"
  -D TFT_CS=15             ; Example pin for 2.8"
  -D TFT_DC=2             ; Example pin for 2.8"
  -D TFT_RST=-1            ; Example pin for 2.8"
  -D TFT_BL=27            ; Example backlight pin
  -D TOUCH_CS=33
  -D TOUCH_INTERRUPT_PIN=GPIO_NUM_36  
  -D CONFIG_FILE=\"/config.2x3.json\"
